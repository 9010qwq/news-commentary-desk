name: Build Windows portable (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install from official Python package registry
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Bundle browser and application
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH='0'
          python -m playwright install chromium
          python -m PyInstaller --noconfirm --clean --onedir --name NewsDesk --add-data 'newsdesk/static;newsdesk/static' --collect-all playwright --collect-all trafilatura --collect-all keyring --collect-all tzdata --hidden-import keyring.backends.Windows launch.py
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md dist/NewsDesk/
          Compress-Archive -Path dist/NewsDesk -DestinationPath dist/NewsDesk-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NewsDesk-Windows-Portable
          path: dist/NewsDesk-Windows-Portable.zip
          retention-days: 14
